version: "3.9"

services:
  # --------------------------------------------------
  # Backend Service (FastAPI + Aiven MySQL)
  # --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhadli-kavya-backend
    restart: unless-stopped

    # ✅ Load ALL database credentials from .env
    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      # Source code (for reload during development)
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_cache:/app/__pycache__

    networks:
      - bhadli-network

    command: uvicorn main:app --host 0.0.0.0 --port 8000

    # (Optional but clean) backend healthcheck
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --------------------------------------------------
  # Frontend Service (React / Expo Web)
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhadli-kavya-frontend
    restart: unless-stopped

    environment:
      REACT_APP_API_URL: http://backend:8000
      NODE_ENV: development

    ports:
      - "8081:8081"
      - "19006:19006"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.expo

    depends_on:
      - backend

    networks:
      - bhadli-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# --------------------------------------------------
# Networks
# --------------------------------------------------
networks:
  bhadli-network:
    driver: bridge

# --------------------------------------------------
# Volumes
# --------------------------------------------------
volumes:
  backend_uploads:
    driver: local
  backend_cache:
    driver: local
